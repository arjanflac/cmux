name: Quiet Codex rendering proof

on:
  push:
    branches: [experiment/quiet-codex-renderer]
    paths:
      - '.github/workflows/quiet-codex-proof.yml'
      - 'experiments/codex-quiet/**'
  workflow_dispatch:
    inputs:
      build_frontend:
        type: boolean
        default: false
        description: Build and package the attach-only frontend

permissions:
  contents: read

concurrency:
  group: quiet-codex-rendering-proof-${{ github.ref }}
  # Let manual builds finish and save their cache before the next one starts.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frontend:
    if: inputs.build_frontend == true
    uses: ./.github/workflows/quiet-codex-frontend.yml
  rendering:
    if: github.repository == 'arjanflac/cmux' && inputs.build_frontend != true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_MIN_STACK: '8388608'
      CODEX_REPO_ROOT: ${{ github.workspace }}/codex
      CARGO_TARGET_DIR: ${{ github.workspace }}/quiet-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: lane
          persist-credentials: false
          sparse-checkout: experiments/codex-quiet
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openai/codex
          ref: 6aaac694803004a63c6f393d153c96d22521a6b9 # rust-v0.164.0
          path: codex
          persist-credentials: false
      - name: Install upstream Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential clang lld cmake pkg-config libcap-dev libasound2-dev libssl-dev bubblewrap
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1, as pinned by Codex 0.164
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quiet-target
          key: quiet-render-v2-linux-rust1991-6aaac694-${{ hashFiles('lane/experiments/codex-quiet/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            quiet-render-v2-linux-rust1991-6aaac694-${{ hashFiles('lane/experiments/codex-quiet/*.patch') }}-
            quiet-render-v2-linux-rust1991-6aaac694-
      - name: Require behavioral failure on stock and success after the rendering patch
        run: |
          python3 -m unittest discover -s lane/experiments/codex-quiet -p test_check.py
          python3 lane/experiments/codex-quiet/check.py --source codex --logs proof-logs
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quiet-target
          key: quiet-render-v2-linux-rust1991-6aaac694-${{ hashFiles('lane/experiments/codex-quiet/*.patch') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-rendering-proof-${{ github.run_id }}
          path: proof-logs/*
          if-no-files-found: warn
          retention-days: 7
