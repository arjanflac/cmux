name: Personal cmux updates

on:
  push:
    branches: [personal]
    paths:
      - '.github/workflows/personal-update.yml'
      - 'scripts/personal-*.py'
  schedule:
    - cron: '31 17 * * 1'
  workflow_dispatch:
    inputs:
      native_artifact_run:
        description: Previous exact-source feature build to package without recompiling
        type: string
        required: false
      quiet_frontend_run:
        description: Optional successful Quiet Codex frontend run to bundle
        type: string
        required: false

concurrency:
  group: personal-cmux-update
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: github.repository == 'arjanflac/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      build: ${{ steps.merge.outputs.build }}
      candidate: ${{ steps.merge.outputs.candidate }}
      sha: ${{ steps.merge.outputs.sha }}
      release: ${{ steps.merge.outputs.release }}
      native_run: ${{ steps.merge.outputs.native_run || github.run_id }}
      reuse_native: ${{ steps.merge.outputs.reuse_native }}
      quiet_sha: ${{ steps.merge.outputs.quiet_sha || steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'personal' }}
          fetch-depth: 0
      - name: Merge the latest stable upstream release into an isolated candidate
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'personal' }}
          NATIVE_ARTIFACT_RUN: ${{ inputs.native_artifact_run }}
          QUIET_FRONTEND_RUN: ${{ inputs.quiet_frontend_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          # Packaging can retry a retained native artifact without another compile.
          # The artifact must come from this repository's native workflow, with
          # a successful build job; package checks its exact source stamp again.
          if [[ -n "$NATIVE_ARTIFACT_RUN" ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch ]]
            [[ "$NATIVE_ARTIFACT_RUN" =~ ^[0-9]+$ ]]
            producer="repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_ARTIFACT_RUN"
            native_sha=$(gh api "$producer" --jq .head_sha)
            producer_path=$(gh api "$producer" --jq .path)
            test "$(gh api "$producer" --jq .event)" = workflow_dispatch
            test "$(gh api "$producer" --jq .head_branch)" != personal
            [[ "$native_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$producer_path" == .github/workflows/personal-update.yml ]]
            test "$(gh run view "$NATIVE_ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --json jobs --jq 'any(.jobs[]; .name == "build" and .conclusion == "success")')" = true
            git cat-file -e "$native_sha^{commit}"
            quiet_sha="$native_sha"
            if [[ -n "$QUIET_FRONTEND_RUN" ]]; then
              [[ "$QUIET_FRONTEND_RUN" =~ ^[0-9]+$ ]]
              quiet_producer="repos/$GITHUB_REPOSITORY/actions/runs/$QUIET_FRONTEND_RUN"
              quiet_sha=$(gh api "$quiet_producer" --jq .head_sha)
              quiet_path=$(gh api "$quiet_producer" --jq .path)
              [[ "$quiet_path" == .github/workflows/quiet-codex-proof.yml || "$quiet_path" == .github/workflows/quiet-codex-frontend.yml ]]
              python3 scripts/quiet_codex_bundle.py "$GITHUB_REPOSITORY" "$native_sha" "$quiet_sha"
            fi
            echo "quiet_sha=$quiet_sha" >> "$GITHUB_OUTPUT"
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'reuse_native=true' >> "$GITHUB_OUTPUT"
            echo "native_run=$NATIVE_ARTIFACT_RUN" >> "$GITHUB_OUTPUT"
            echo "sha=$native_sha" >> "$GITHUB_OUTPUT"
            echo 'release=packaging-only' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new native compile can use a retained frontend from another commit
          # only when the complete frontend tree, workflows and SDK selector match.
          # Native inputs are built from this exact source; no overlay is allowed.
          if [[ -n "$QUIET_FRONTEND_RUN" ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch ]]
            [[ "$SOURCE_REF" != personal ]]
            [[ "$QUIET_FRONTEND_RUN" =~ ^[0-9]+$ ]]
            quiet_producer="repos/$GITHUB_REPOSITORY/actions/runs/$QUIET_FRONTEND_RUN"
            quiet_sha=$(gh api "$quiet_producer" --jq .head_sha)
            quiet_path=$(gh api "$quiet_producer" --jq .path)
            [[ "$quiet_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$quiet_path" == .github/workflows/quiet-codex-proof.yml || "$quiet_path" == .github/workflows/quiet-codex-frontend.yml ]]
            git fetch --no-tags --depth=1 origin "$quiet_sha"
            python3 scripts/quiet_codex_bundle.py --fresh-native "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$quiet_sha"
            echo "quiet_sha=$quiet_sha" >> "$GITHUB_OUTPUT"
          fi
          # A manually selected feature branch gets an exact-source build and
          # artifact without changing personal or merging upstream into it.
          if [[ "$SOURCE_REF" != personal ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "candidate=$SOURCE_REF" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'release=custom-source' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release=$(gh api repos/manaflow-ai/cmux/releases/latest --jq .tag_name)
          [[ "$release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch https://github.com/manaflow-ai/cmux.git "refs/tags/$release:refs/tags/$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$release" HEAD && [[ "$EVENT_NAME" == schedule ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Already contains the latest stable release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'cmux+ update bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate="personal-candidate/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$candidate"
          # A conflict stops here. No PR is opened and the working branch is untouched.
          git merge --no-edit "$release"
          git push origin "HEAD:refs/heads/$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install the Go toolchain required by the Release tunnel component
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Select the pinned Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Prepare native toolchains
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "cache-id=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          go version
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
          rustup toolchain install stable --profile minimal
          rustup default stable
          rust_version=$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' Native/DiffSidecar/rust-toolchain.toml)
          rustup toolchain install "$rust_version" --profile minimal
          # Version and SHA-256 are read from Zig's official distribution index.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, urllib.request
          version = re.search(r'\.minimum_zig_version\s*=\s*"([^"]+)"', pathlib.Path('ghostty/build.zig.zon').read_text()).group(1)
          index = json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))
          item = index[version]['aarch64-macos']
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig.tar.xz'
          urllib.request.urlretrieve(item['tarball'], archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == item['shasum']
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'personal-zig'
          destination.mkdir()
          subprocess.run(['tar', '-xf', str(archive), '-C', str(destination), '--strip-components=1'], check=True)
          with open(os.environ['GITHUB_PATH'], 'a') as stream: stream.write(str(destination) + '\n')
          PY
      - name: Restore native dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/cmux
          key: personal-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'scripts/ghosttykit-checksums.txt') }}
      - name: Restore incremental Xcode build outputs and unchanged source timestamps
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          deriveddata-directory: ~/Library/Developer/Xcode/DerivedData/cmux-personal
          sourcepackages-directory: ~/Library/Developer/Xcode/DerivedData/cmux-personal/SourcePackages
          key: personal-xcode-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('scripts/personal-build.py') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: personal-xcode-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('scripts/personal-build.py') }}-
          swiftpm-cache-key: personal-spm-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('**/Package.resolved') }}
          restore-mtime-targets: |
            **/*.rs
            **/*.go
            **/*.zig
            **/*.sh
            **/*.py
            **/*.toml
            **/Cargo.lock
            **/go.mod
            **/go.sum
      - name: Check custom settings, Swift syntax, and test wiring
        run: python3 scripts/verify-local.py --swift-changed origin/main
      - name: Build an isolated native Release app
        run: python3 scripts/personal-build.py
      - name: Record incremental build cache size
        run: du -sh "$HOME/Library/Developer/Xcode/DerivedData/cmux-personal"
      - name: Preserve the compiled native app independently of frontend packaging
        env:
          NATIVE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p dist/native
          ditto -c -k --sequesterRsrc --keepParent "$HOME/Library/Developer/Xcode/DerivedData/cmux-personal/Build/Products/Release/cmux-custom-build.app" dist/native/cmux-native-unpackaged-arm64.zip
          printf '%s\n' "$NATIVE_SOURCE_SHA" > dist/native/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-native-unpackaged-arm64-${{ github.run_id }}
          path: dist/native/*
          compression-level: 0
          retention-days: 7
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personal-build-log-${{ github.run_id }}
          path: /tmp/cmux-reload-workspace-icons.log
          retention-days: 7

  frontend_ready:
    needs: prepare
    if: inputs.quiet_frontend_run != ''
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 190
    env:
      GH_TOKEN: ${{ github.token }}
      QUIET_RUN: ${{ inputs.quiet_frontend_run }}
    steps:
      - name: Wait for the explicitly selected frontend without occupying a Mac runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUIET_RUN" =~ ^[0-9]+$ ]]
          for ((attempt=1; attempt<=360; attempt++)); do
            outcome=$(gh run view "$QUIET_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + ":" + .conclusion')
            if [[ "$outcome" == completed:success ]]; then exit 0; fi
            if [[ "$outcome" == completed:* ]]; then
              echo "::error::Quiet frontend run $QUIET_RUN finished: $outcome"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Selected frontend did not finish within the queue/build budget"
          exit 1

  package:
    needs: [prepare, build, frontend_ready]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.prepare.outputs.reuse_native == 'true') && (needs.frontend_ready.result == 'success' || needs.frontend_ready.result == 'skipped') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Select the pinned Xcode
        run: ./scripts/select-ci-xcode.sh
      - uses: actions/download-artifact@v4
        with:
          name: cmux-native-unpackaged-arm64-${{ needs.prepare.outputs.native_run }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.native_run }}
          path: ${{ runner.temp }}/cmux-native-archive
      - name: Verify native source identity and extract the compiled app
        env:
          NATIVE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(cat "$RUNNER_TEMP/cmux-native-archive/source-commit.txt")" = "$NATIVE_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/cmux-native"
          ditto -x -k "$RUNNER_TEMP/cmux-native-archive/cmux-native-unpackaged-arm64.zip" "$RUNNER_TEMP/cmux-native"
      - name: Download the explicitly selected quiet frontend
        if: github.event_name == 'workflow_dispatch' && inputs.quiet_frontend_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUIET_RUN: ${{ inputs.quiet_frontend_run }}
          QUIET_REPOSITORY: ${{ github.repository }}
          QUIET_SOURCE_SHA: ${{ needs.prepare.outputs.quiet_sha }}
          REUSE_NATIVE: ${{ needs.prepare.outputs.reuse_native }}
        run: |
          [[ "$QUIET_RUN" =~ ^[0-9]+$ ]]
          test "$(gh run view "$QUIET_RUN" --repo "$QUIET_REPOSITORY" --json headSha --jq .headSha)" = "$QUIET_SOURCE_SHA"
          # Only the compiled-native reuse lane may overlay a verified
          # frontend-only descendant. Fresh native builds keep their source.
          if [[ "$REUSE_NATIVE" == true && "$(git rev-parse HEAD)" != "$QUIET_SOURCE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$QUIET_SOURCE_SHA"
            git restore --source="$QUIET_SOURCE_SHA" --worktree -- experiments/codex-quiet
          fi
          # The Linux readiness job already observed success. Recheck before
          # fetching immutable artifacts; never dispatch or retry a build here.
          test "$(gh run view "$QUIET_RUN" --repo "$QUIET_REPOSITORY" --json conclusion --jq .conclusion)" = success
          gh run download "$QUIET_RUN" --repo "$QUIET_REPOSITORY" \
            --name "quiet-codex-ARM64-$QUIET_RUN" --dir "$RUNNER_TEMP/cmux-quiet-frontend"
          python3 - "$RUNNER_TEMP/cmux-quiet-frontend/manifest.json" "$QUIET_SOURCE_SHA" <<'PY'
          import json, pathlib, sys
          if json.loads(pathlib.Path(sys.argv[1]).read_text()).get("cmux_commit") != sys.argv[2]:
              raise ValueError("Frontend artifact does not name the selected producer commit")
          PY
      - name: Package candidate without official auto-updates
        run: |
          quiet_args=()
          if [[ -d "$RUNNER_TEMP/cmux-quiet-frontend" ]]; then
            quiet_args=(--quiet-artifact "$RUNNER_TEMP/cmux-quiet-frontend")
          fi
          python3 scripts/personal-package.py "$RUNNER_TEMP/cmux-native/cmux-custom-build.app" "${quiet_args[@]}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$HOME/Applications/cmux+.app" dist/cmux-personal-arm64.zip
          shasum -a 256 dist/cmux-personal-arm64.zip > dist/cmux-personal-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-personal-arm64-${{ github.run_id }}
          path: dist/*
          retention-days: 7

  promote:
    needs: [prepare, package]
    if: inputs.native_artifact_run == '' && (github.event_name != 'workflow_dispatch' || github.ref_name == 'personal')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0
      - name: Advance personal source only after a successful build
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          UPSTREAM_RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          # Never move personal backwards when a newer custom commit already
          # contains this verified candidate. A divergent branch still fails.
          git fetch origin personal
          current=$(git rev-parse origin/personal)
          if git merge-base --is-ancestor "$EXPECTED_SHA" "$current"; then
            echo "personal already contains the built candidate; retaining newer commits."
          elif git merge-base --is-ancestor "$current" "$EXPECTED_SHA"; then
            git push origin "$EXPECTED_SHA:refs/heads/personal"
          else
            echo "::error::personal diverged while the candidate built; no source was overwritten."
            exit 1
          fi
          git push origin --delete "$CANDIDATE"
          echo "Built $EXPECTED_SHA with upstream $UPSTREAM_RELEASE. Download the candidate from this run's artifacts; installation is manual." >> "$GITHUB_STEP_SUMMARY"
