name: Quiet Codex frontend
on:
  push:
    branches: [feat/quiet-codex-frontend]
    paths: ['experiments/codex-quiet/**', '.github/workflows/quiet-codex-frontend.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quiet-codex-frontend-${{ github.ref }}
  # Let manual builds finish and save their cache before the next one starts.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  frontend:
    if: github.repository == 'arjanflac/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_MIN_STACK: '8388608'
      CARGO_TARGET_DIR: ${{ github.workspace }}/quiet-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: lane
          persist-credentials: false
      - name: Select pinned Xcode
        run: lane/scripts/select-ci-xcode.sh
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 6aaac694803004a63c6f393d153c96d22521a6b9
          path: codex
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quiet-target
          key: quiet-frontend-v1-${{ runner.os }}-${{ runner.arch }}-6aaac694-${{ hashFiles('lane/experiments/codex-quiet/*.patch') }}-${{ github.run_id }}
          restore-keys: quiet-frontend-v1-${{ runner.os }}-${{ runner.arch }}-6aaac694-
      - name: Validate artifact provenance helpers
        run: python3 -m unittest discover -s lane/experiments/codex-quiet -p 'test_*.py'
      - name: Test attach boundaries and rendering, then package the derived frontend
        run: python3 lane/experiments/codex-quiet/build.py --source codex --output artifact
      - uses: actions/cache/save@v4
        if: always() && !cancelled()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quiet-target
          key: quiet-frontend-v1-${{ runner.os }}-${{ runner.arch }}-6aaac694-${{ hashFiles('lane/experiments/codex-quiet/*.patch') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-codex-${{ runner.arch }}-${{ github.run_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
